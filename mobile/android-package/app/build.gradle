plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
 namespace 'br.com.kannali.cuidali'
 androidResources { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~' }
 compileSdk 36
 defaultConfig { applicationId 'br.com.kannali.cuidali'; minSdk 24; targetSdk 36; versionCode 5; versionName '1.0.1' }
 sourceSets { main { manifest.srcFile '../AndroidManifest.xml'; java.srcDirs = ['../src']; java.exclude '**/CareService.java'; res.srcDirs = ['../res']; assets.srcDirs = [System.getenv('CUIDALI_ASSETS_DIR') ?: '../production-assets'] } }
 signingConfigs { release { storeFile file('../build/cuidali-demonstracao.jks'); storePassword System.getenv('CUIDALI_KEYSTORE_PASSWORD') ?: 'android'; keyAlias 'cuidali-demo'; keyPassword System.getenv('CUIDALI_KEYSTORE_PASSWORD') ?: 'android' } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:35.2.0'); implementation 'com.google.firebase:firebase-messaging' }
tasks.withType(JavaCompile).configureEach {
 options.incremental = false
 options.fork = true
 options.forkOptions.executable = new File(System.getenv('JAVA_HOME'), System.getProperty('os.name').toLowerCase().contains('windows') ? 'bin/javac.exe' : 'bin/javac').absolutePath
}
