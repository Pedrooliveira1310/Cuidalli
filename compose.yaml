services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cuidali
      MYSQL_USER: cuidali
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD}
    volumes:
      - cuidali-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    command: ["sh", "-c", "php /var/www/cuidali/migrate.php && apache2-foreground"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cuidali
      DB_USER: cuidali
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      COOKIE_SECURE: "true"
      APP_TIMEZONE: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
  monitor:
    build: .
    restart: unless-stopped
    command: ["php", "/var/www/cuidali/monitor.php", "--continuous"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cuidali
      DB_USER: cuidali
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CUIDALI_DOMAIN: ${CUIDALI_DOMAIN:?Defina seu dominio}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina seu email administrativo}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - cuidali-certificates:/data
      - cuidali-caddy:/config
    depends_on:
      - app
volumes:
  cuidali-db:
  cuidali-certificates:
  cuidali-caddy:
